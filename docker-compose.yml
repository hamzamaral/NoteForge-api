services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noteforge
      POSTGRES_PASSWORD: noteforge
      POSTGRES_DB: noteforge
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nf_pg:/var/lib/postgresql/data

  # Optional: set MINIO_ENABLED=1 in .env to use object storage instead of ./uploads
  minio:
    image: minio/minio:latest
    profiles: ['minio']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: noteforge
      MINIO_ROOT_PASSWORD: noteforgesecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nf_minio:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: noteforge_meili_dev_key
    ports:
      - "7700:7700"
    volumes:
      - nf_meili:/meili_data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nf_pg:
  nf_meili:
  nf_minio:
