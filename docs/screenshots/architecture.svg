<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="NoteForge API architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="920" height="420" rx="16" fill="url(#bg)"/>
  <text x="32" y="42" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">NoteForge API</text>
  <text x="32" y="68" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">NestJS · Prisma · Socket.IO · Yjs</text>

  <g filter="url(#s)">
    <rect x="32" y="100" width="160" height="72" rx="12" fill="#0f766e"/>
    <text x="112" y="132" text-anchor="middle" fill="#ecfdf5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">NoteForge-web</text>
    <text x="112" y="152" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Vite · TipTap · Excalidraw</text>
  </g>

  <path d="M200 136 H250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <g filter="url(#s)">
    <rect x="260" y="88" width="220" height="96" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="370" y="120" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">NestJS API :3001</text>
    <text x="370" y="142" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">REST /api/v1 · Swagger /api/docs</text>
    <text x="370" y="162" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Socket /sync · JWT</text>
  </g>

  <path d="M480 120 H540" stroke="#64748b" stroke-width="2"/>
  <path d="M480 152 H540" stroke="#64748b" stroke-width="2"/>

  <g filter="url(#s)">
    <rect x="540" y="70" width="160" height="56" rx="10" fill="#0369a1"/>
    <text x="620" y="104" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Postgres :5434</text>
  </g>
  <g filter="url(#s)">
    <rect x="540" y="140" width="160" height="56" rx="10" fill="#7c3aed"/>
    <text x="620" y="174" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Meilisearch :7700</text>
  </g>

  <text x="32" y="230" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Modules</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect x="32" y="246" width="100" height="36" rx="8" fill="#334155"/><text x="82" y="269" text-anchor="middle" fill="#f1f5f9">Auth</text>
    <rect x="144" y="246" width="110" height="36" rx="8" fill="#334155"/><text x="199" y="269" text-anchor="middle" fill="#f1f5f9">Workspaces</text>
    <rect x="266" y="246" width="110" height="36" rx="8" fill="#334155"/><text x="321" y="269" text-anchor="middle" fill="#f1f5f9">Pages/Blocks</text>
    <rect x="388" y="246" width="90" height="36" rx="8" fill="#334155"/><text x="433" y="269" text-anchor="middle" fill="#f1f5f9">Tasks</text>
    <rect x="490" y="246" width="110" height="36" rx="8" fill="#334155"/><text x="545" y="269" text-anchor="middle" fill="#f1f5f9">Databases</text>
    <rect x="612" y="246" width="90" height="36" rx="8" fill="#334155"/><text x="657" y="269" text-anchor="middle" fill="#f1f5f9">Shares</text>
    <rect x="714" y="246" width="100" height="36" rx="8" fill="#334155"/><text x="764" y="269" text-anchor="middle" fill="#f1f5f9">Comments</text>
    <rect x="826" y="246" width="62" height="36" rx="8" fill="#334155"/><text x="857" y="269" text-anchor="middle" fill="#f1f5f9">Sync</text>
  </g>

  <text x="32" y="330" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Source of truth</text>
  <text x="32" y="356" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Postgres `Block` = kal1c1 kay1t · Yjs = canl1 oturum · sayfa terk / F5 öncesi REST flush</text>
  <text x="32" y="386" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Demo: admin@noteforge.local / Admin123!  ·  Health: GET /api/v1/health</text>
</svg>
